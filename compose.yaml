services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: cagemetrics
      POSTGRES_USER: cagemetrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cagemetrics_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cagemetrics -d cagemetrics"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://cagemetrics:${POSTGRES_PASSWORD:-cagemetrics_dev}@database:5432/cagemetrics
      CAGEMETRICS_MODEL_CHANNEL: auto
    volumes:
      - app-data:/var/lib/cagemetrics
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres-data:
  app-data:
