name: Validate pipeline and API
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cagemetrics
          POSTGRES_PASSWORD: cagemetrics
          POSTGRES_DB: cagemetrics_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CAGEMETRICS_TEST_DATABASE_URL: postgresql+psycopg://cagemetrics:cagemetrics@localhost:5432/cagemetrics_test
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.14"
          cache: pip
      - run: pip install -c requirements-lock.txt -e '.[dev,postgres]'
      - run: ruff check src tests migrations scripts
      - run: pytest --cov=cagemetrics --cov-report=term-missing
      - run: node --check src/cagemetrics/web/app.js
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t cagemetrics:ci .
      - run: docker run -d --name cagemetrics-smoke -p 127.0.0.1:8000:8000 cagemetrics:ci
      - name: Wait for offline bootstrap and model readiness
        run: |
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2) as response:
                      health = json.load(response)
                  assert health['status'] == 'ready'
                  assert health['model_version'].startswith('v3-')
                  assert health['winner_model_version'].startswith('winner-')
                  assert health['rounds_model_version'].startswith('rounds-')
                  break
              except Exception:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          base = 'http://127.0.0.1:8000'
          athletes = []
          for name in ('Justin%20Gaethje', 'Paddy%20Pimblett'):
              with urllib.request.urlopen(base + '/api/v1/fighters?q=' + name + '&limit=1') as response:
                  athletes.extend(json.load(response)['fighters'])
          request = urllib.request.Request(
              base + '/api/v1/predict-winner',
              data=json.dumps({'fighter_a_id': athletes[0]['fighter_id'],
                               'fighter_b_id': athletes[1]['fighter_id'],
                               'scheduled_rounds': 3}).encode(),
              headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          assert abs(result['p_fighter_win'] + result['p_opponent_win'] - 1) < 1e-12
          assert result['scope'] == 'conditional on a decisive outcome'
          with urllib.request.urlopen(base + '/api/v1/winner-predictions/' + result['prediction_id']) as response:
              assert json.load(response) == result
          request = urllib.request.Request(
              base + '/api/v1/predict-rounds',
              data=json.dumps({'fighter_a_id': athletes[0]['fighter_id'],
                               'fighter_b_id': athletes[1]['fighter_id'],
                               'scheduled_rounds': 3, 'line': 3}).encode(),
              headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              duration = json.load(response)
          assert duration['p_over'] == 0
          assert duration['p_push'] == duration['p_complete_scheduled_time']
          assert len(duration['round_thresholds']) == 6
          with urllib.request.urlopen(base + '/api/v1/rounds-predictions/' + duration['prediction_id']) as response:
              assert json.load(response) == duration
          PY
      - if: always()
        run: docker logs cagemetrics-smoke
      - if: always()
        run: docker rm -f cagemetrics-smoke
