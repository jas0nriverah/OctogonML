[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cagemetrics"
version = "0.4.0"
description = "UFC strike forecasts, calibrated win probabilities, SQL pipelines, and FastAPI inference."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "pandas>=2.2,<4", "numpy>=2.0,<3",
  "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "httpx>=0.28,<1",
  "threadpoolctl>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
cagemetrics = "cagemetrics.cli:main"

[project.urls]
Repository = "https://github.com/jas0nriverah/OctogonML"
Documentation = "https://github.com/jas0nriverah/OctogonML/tree/main/docs"
Issues = "https://github.com/jas0nriverah/OctogonML/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cagemetrics = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.coverage.run]
source = ["cagemetrics"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
